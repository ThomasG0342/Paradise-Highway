<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aire de Jeu – TCG des aires d'autoroute</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #e9edf1;
        --ink: #14202b;
        --panel: #fff;
        --panel2: #f1f4f7;
        --line: #cdd5dc;
        --road: #f2b705;
        --sea: #cfe1ee;
        --land: #f6f3ea;
        --landline: #aab3ba;
        --edge: #5f7282;
        --node: #fff;
        --nodes: #3f5262;
        --glass: rgba(255, 255, 255, 0.85);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1116;
          --ink: #e8eef3;
          --panel: #161d24;
          --panel2: #1d262e;
          --line: #2a3540;
          --road: #ffc82c;
          --sea: #0a141c;
          --land: #17222b;
          --landline: #33444f;
          --edge: #6a8092;
          --node: #22303b;
          --nodes: #8ba0b0;
          --glass: rgba(22, 29, 36, 0.86);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1116;
        --ink: #e8eef3;
        --panel: #161d24;
        --panel2: #1d262e;
        --line: #2a3540;
        --road: #ffc82c;
        --sea: #0a141c;
        --land: #17222b;
        --landline: #33444f;
        --edge: #6a8092;
        --node: #22303b;
        --nodes: #8ba0b0;
        --glass: rgba(22, 29, 36, 0.86);
      }
      html,
      body {
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.4 Barlow,
          system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      h1,
      h2,
      .cond {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--road);
        outline-offset: 2px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        padding: 10px 16px;
        background: linear-gradient(180deg, #0d57b8, #083a7c);
        color: #fff;
        box-shadow:
          0 3px 0 #fff,
          0 7px 16px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 5;
      }
      h1 {
        margin: 0;
        font-size: 27px;
        display: flex;
        align-items: center;
      }
      .logo {
        background: #fff;
        color: #0b4ea2;
        border-radius: 6px;
        padding: 0 9px;
        margin-right: 9px;
        line-height: 1.15;
      }
      nav {
        display: flex;
        background: rgba(0, 0, 0, 0.28);
        border-radius: 999px;
        padding: 3px;
      }
      nav button {
        border: 0;
        border-radius: 999px;
        padding: 6px 18px;
        color: #fff;
        background: transparent;
      }
      nav button[aria-selected="true"] {
        background: #fff;
        color: #0b4ea2;
        font-weight: 700;
      }
      .hud {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .stat b {
        font:
          700 22px "Barlow Condensed",
          sans-serif;
      }
      .track {
        width: 110px;
        height: 8px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--road);
        transition: width 0.6s;
      }
      .pack {
        background: var(--road);
        color: #1a1300;
        border: 0;
        font-weight: 700;
        border-radius: 999px;
        padding: 9px 18px;
        box-shadow: 0 3px 0 #a77b00;
      }
      .pack:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #a77b00;
      }
      .pack:disabled {
        opacity: 0.5;
        cursor: default;
      }
      main {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .view {
        display: none;
        position: absolute;
        inset: 0;
      }
      .view.on {
        display: block;
      }
      #col {
        overflow: auto;
        padding: 18px;
      }
      #svg {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--sea);
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      #svg.grab {
        cursor: grabbing;
      }
      .land {
        fill: var(--land);
        stroke: var(--landline);
        stroke-width: 1.5px;
        vector-effect: non-scaling-stroke;
      }
      .rd {
        stroke: var(--edge);
        stroke-width: 1px;
        opacity: 0.45;
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
      }
      .rd.on {
        stroke: var(--road);
        stroke-width: 3.5px;
        opacity: 1;
      }
      .sat .rd.on {
        stroke-width: 2px;
        opacity: 0.8;
      }
      .node {
        fill: var(--node);
        stroke: var(--nodes);
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
      }
      .node.own {
        fill: var(--road);
        stroke: #fff;
        stroke-width: 1.5px;
      }
      .node.next {
        stroke: var(--road);
        stroke-width: 2.5px;
        animation: pulse 1.5s ease-in-out infinite alternate;
      }
      .node.sel {
        stroke: #e0284f;
        stroke-width: 3px;
      }
      @keyframes pulse {
        to {
          stroke-opacity: 0.2;
        }
      }
      .lb {
        display: none;
        fill: #fff;
        stroke: rgba(0, 0, 0, 0.75);
        stroke-width: 3px;
        paint-order: stroke;
        vector-effect: non-scaling-stroke;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        pointer-events: none;
      }
      .lab .lb {
        display: block;
      }
      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .info {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: min(300px, calc(100% - 84px));
        padding: 14px;
      }
      .info h2 {
        margin: 0 0 4px;
        font-size: 23px;
      }
      .info p {
        margin: 6px 0;
      }
      .muted {
        opacity: 0.7;
        font-size: 14px;
      }
      .key {
        position: absolute;
        left: 12px;
        top: 12px;
        padding: 6px 12px;
        font-size: 13px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .key i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        background: var(--road);
        border: 1.5px solid #fff;
      }
      .key i.nx {
        background: var(--node);
        border-color: var(--road);
      }
      .zoom {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .zoom button {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        font-size: 22px;
        color: var(--ink);
        background: var(--glass);
        border: 1px solid var(--line);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
      .card {
        aspect-ratio: 5/7;
        border-radius: 14px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: linear-gradient(160deg, var(--c1), var(--c2));
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.4);
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      }
      .card.aire.r1 {
        --c1: #7a46e0;
        --c2: #2a1862;
      }
      .card.aire.r2 {
        --c1: #f0b010;
        --c2: #8a4f06;
      }
      .card.aire.r3 {
        --c1: #ff3d6e;
        --c2: #4d0a2a;
      }
      .card.portion {
        --c1: #0f5cc4;
        --c2: #082f66;
      }
      .card.junk {
        --c1: #66757f;
        --c2: #29323a;
      }
      .card.r3::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 30%,
          rgba(255, 255, 255, 0.35) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        animation: sheen 3s ease-in-out infinite;
      }
      @keyframes sheen {
        60%,
        100% {
          transform: translateX(100%);
        }
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        min-height: 22px;
      }
      .plate {
        background: #fff;
        color: #0b4ea2;
        font:
          700 14px "Barlow Condensed",
          sans-serif;
        border-radius: 4px;
        padding: 0 7px;
      }
      .art {
        flex: 1;
        display: grid;
        place-items: center;
        font-size: clamp(34px, 6vw, 48px);
        background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.26), transparent 66%);
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      }
      .nm {
        font:
          700 19px/1.05 "Barlow Condensed",
          sans-serif;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .sub {
        font-size: 12px;
        opacity: 0.8;
      }
      .x {
        position: absolute;
        right: 8px;
        top: 34px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 9px;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 700;
      }
      .card.new::after {
        content: "Nouveau";
        position: absolute;
        left: 8px;
        top: 32px;
        background: #ffc82c;
        color: #111;
        font-size: 11px;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 5px;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: rgba(5, 9, 13, 0.82);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 9;
      }
      #ov.on {
        display: flex;
      }
      .box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        max-width: 940px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
      }
      .box h2 {
        margin: 0;
        font-size: 28px;
      }
      #welcome {
        max-width: 430px;
      }
      .box button:not(.pack) {
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 18px;
      }
      .cw {
        border-radius: 14px;
        cursor: pointer;
      }
      .cw .card {
        transition: transform 0.15s;
      }
      .cw:hover .card {
        transform: translateY(-3px);
      }
      .cw:focus-visible {
        outline: 3px solid var(--road);
        outline-offset: 3px;
      }
      .det {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .det > .card {
        width: 210px;
        flex: none;
      }
      .det > div {
        flex: 1;
        min-width: 220px;
      }
      .phw {
        position: relative;
        max-width: 420px;
        margin: 10px 0;
      }
      .ph {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 12px;
        background: var(--panel2);
      }
      .phw::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px;
        border: 3px solid #e0284f;
        border-radius: 50%;
        box-shadow: 0 0 0 2px #fff;
      }
      .det dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        margin: 14px 0;
      }
      .det dt {
        opacity: 0.65;
      }
      .det dd {
        margin: 0;
      }
      .reveal {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 14px;
        margin: 16px 0;
      }
      .flip {
        position: relative;
        perspective: 900px;
      }
      .flip .card,
      .flip .back {
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .flip .card {
        transform: rotateY(180deg);
      }
      .flip.up .card {
        transform: none;
      }
      .flip .back {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: repeating-linear-gradient(135deg, #0b4ea2 0 10px, #0a4592 10px 20px);
        border: 2px solid #fff;
        display: grid;
        place-items: center;
        color: #fff;
        font:
          700 42px "Barlow Condensed",
          sans-serif;
        cursor: pointer;
      }
      .flip.up .back {
        transform: rotateY(180deg);
      }
      .flip.up .card.r3 {
        box-shadow: 0 0 28px #ff3d6e;
      }
      .flip.up .card.r2 {
        box-shadow: 0 0 22px #f0b010;
      }
      .flip.up .card.r1 {
        box-shadow: 0 0 20px #7a46e0;
      }
      input {
        font: inherit;
        padding: 10px;
        border: 2px solid var(--line);
        border-radius: 10px;
        width: 100%;
        margin: 8px 0 14px;
        background: var(--panel2);
        color: var(--ink);
      }
      @media (max-width: 640px) {
        .hud {
          margin-left: 0;
          width: 100%;
        }
        .track {
          flex: 1;
        }
        .key {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <header class="bar">
      <h1><span class="logo">A</span>Aire de Jeu</h1>
      <nav role="tablist">
        <button role="tab" aria-selected="true" data-v="map">Carte</button
        ><button role="tab" aria-selected="false" data-v="col">Collection</button>
      </nav>
      <div class="hud">
        <span class="stat"><b id="cnt">0</b> / <span id="tot"></span> aires</span>
        <div class="track"><i id="prog"></i></div>
        <span class="stat" id="timer"></span>
        <button class="pack" id="open">Ouvrir un pack</button>

        <!-- Nouveau bouton de déconnexion -->
        <button
          id="btn_logout"
          style="
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            color: #fff;
            border-radius: 999px;
            padding: 6px 14px;
            margin-left: 8px;
          "
        >
          Quitter
        </button>
      </div>
    </header>
    <main>
      <section class="view on" id="map">
        <svg
          id="svg"
          role="img"
          aria-label="Carte des aires d'autoroute de France"
          preserveAspectRatio="xMidYMid slice"
        ></svg>
        <div class="key glass">
          <span><i></i>Débloquée</span><span><i class="nx"></i>Tirable</span
          ><span>Zone claire : satellite</span>
        </div>
        <aside class="info glass" id="info"></aside>
        <div class="zoom">
          <button id="zi" aria-label="Zoom avant">＋</button
          ><button id="zo" aria-label="Zoom arrière">－</button
          ><button id="zr" aria-label="Voir toute la France">⌖</button
          ><button id="zm" aria-label="Zoom sur mes aires" title="Mes aires">📍</button>
        </div>
      </section>
      <section class="view" id="col"><div class="grid" id="grid"></div></section>
    </main>
    <div id="ov"><div class="box" id="box"></div></div>

        const { need, drawable } = frontier();
        const r = Math.random();
        if (drawable.length && r < 0.2) {
          const tot = drawable.reduce((s, i) => s + S[AD[i].size].w, 0);
          let x = Math.random() * tot;
          for (const i of drawable) {
            x -= S[AD[i].size].w;
            if (x <= 0) return i;
          }
          return drawable[0];
        }
        if (need.length && r < 0.6) {
          const tot = need.reduce((s, p) => s + RD[p.t].w, 0);
          let x = Math.random() * tot;
          for (const p of need) {
            x -= RD[p.t].w;
            if (x <= 0) return p.id;
          }
          return need[0].id;
        }
        return "v:" + Math.floor(Math.random() * V.length);
      }
      function openPack() {
        tick();
        if (st.packs < 1) return;
        const wasFull = st.packs >= MAXP;
        st.packs--;
        if (wasFull) st.last = now();
        const cards = [];
        for (let i = 0; i < 5; i++) {
          const c = draw();
          const isNew = !st.inv[c];
          st.inv[c] = (st.inv[c] || 0) + 1;
          cards.push({ c, isNew });
        }
        save();
        showPack(cards);
        render();
      }

      // ---- rendu ----
      function cardHTML(c, o = {}) {
        const cnt = o.count > 1 ? `<span class="x">×${o.count}</span>` : "",
          nw = o.isNew ? " new" : "";
        if (AD[c]) {
          const a = AD[c],
            q = S[a.size];
          return `<div class="card aire r${a.size}${nw}">${cnt}<div class="top"><span class="plate">${a.ref}</span><span>${q.r}</span></div><div class="art">⛽</div><div class="nm">${a.name}</div><div class="sub">Aire ${q.n.toLowerCase()}</div></div>`;
        }
        if (c[0] == "p") {
          const p = PD[c],
            j = p.road == "jonction",
            u = AD[p.a],
            v = AD[p.b],
            km = Math.max(
              1,
              Math.round(
                Math.hypot(
                  (u.lat - v.lat) * 111,
                  (u.lon - v.lon) * 111 * Math.cos(((u.lat + v.lat) * Math.PI) / 360)
                )
              )
            ),
            pl = j ? (u.ref == v.ref ? u.ref : u.ref + "↔" + v.ref) : p.road,
            nm =
              u.name == v.name
                ? `${u.name} (${u.ref}) ↔ ${v.name} (${v.ref})`
                : `${u.name} ↔ ${v.name}`;
          return `<div class="card portion${nw}">${cnt}<div class="top"><span class="plate">${pl}</span><span>Commune</span></div><div class="art">${j ? "🔀" : "🛣️"}</div><div class="nm">${nm}</div><div class="sub">${j ? "Jonction" : "Portion de " + p.road} · ${km} km</div></div>`;
        }
        const v = V[+c.slice(2)];
        return `<div class="card junk${nw}">${cnt}<div class="top"><span>Commune</span></div><div class="art">${v[0]}</div><div class="nm">${v[1]}</div><div class="sub">Ne sert à rien</div></div>`;
      }
      function showPack(cards) {
        const box = document.getElementById("box");

        document.getElementById("cl").onclick = () =>
          document.getElementById("ov").classList.remove("on");
        const nx = document.getElementById("nx");
        nx.disabled = st.packs < 1;
        nx.onclick = openPack;
      }
      let sel = null;

          .sort((x, y) => AD[y].size - AD[x].size || AD[x].name.localeCompare(AD[y].name, "fr"))

        g.innerHTML = items

      }
      function info(own, drawable) {
        const el = document.getElementById("info");
        if (!sel) {
          el.innerHTML = `<h2>${st.name}</h2><p class="muted">Tu es parti d'une aire tirée au hasard. Récupère les portions d'autoroute qui la relient à ses voisines, puis tire ces aires en pack.</p><p>Clique une aire pour voir son état.</p>`;
          return;
        }
        const a = AD[sel],

      function welcome() {

          const s = pick(A)[0];
          const initialSt = { name: username, inv: { [s]: 1 }, packs: 10, last: now(), seen: {} };

          try {
            const res = await fetch(`${API_URL}/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password, initialState: initialSt }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            token = data.token;
            localStorage.setItem("aire_jwt", token);
            st = initialSt;
            document.getElementById("ov").classList.remove("on");
            box.id = "box";
            focus(s);

          } catch (e) {
            showErr(e.message);
          }

      }

      const svgEl = document.getElementById("svg"),
        NS = "http://www.w3.org/2000/svg";
      let zp = [];
      let cur = { x: 0, y: 0, w: 600 },
        tgt = { ...cur },
        raf = 0,
        pts = new Map(),
        moved = 0,
        pinch = 0,
        nodeEls = [],
        nodeById = {},
        lbEls = [],
        tiles = new Map(),
        tileKey = "",
        lastW = 0;
      const asp = () => (svgEl.clientWidth ? svgEl.clientHeight / svgEl.clientWidth : H / 600);
      const clampV = (v) => {
        v.w = Math.max(4, Math.min(1600, v.w));
        const h = v.w * asp(),
          cx = Math.max(0, Math.min(600, v.x + v.w / 2)),
          cy = Math.max(0, Math.min(H, v.y + h / 2));
        v.x = cx - v.w / 2;
        v.y = cy - h / 2;
      };
      const go = () => {
        if (!raf) raf = requestAnimationFrame(step);
      };
      function step() {
        raf = 0;
        const k = 0.2;
        cur.x += (tgt.x - cur.x) * k;
        cur.y += (tgt.y - cur.y) * k;
        cur.w += (tgt.w - cur.w) * k;
        const e = cur.w * 0.0008;
        if (
          Math.abs(tgt.w - cur.w) < e &&
          Math.abs(tgt.x - cur.x) < e &&
          Math.abs(tgt.y - cur.y) < e
        )
          cur = { ...tgt };
        else go();
        applyView();
      }
      function fit() {
        const a = asp(),
          w = Math.max(600, (H + 30) / a);
        return { x: 300 - w / 2, y: H / 2 - (w * a) / 2, w };
      }
      function focus(i, w = 70) {
        const a = AD[i],
          h = w * asp();
        tgt = { x: px(a) - w / 2, y: py(a) - h / 2, w };
        clampV(tgt);
        cur = { ...tgt };
        applyView(true);
      }
      function zoomAt(f, fx = 0.5, fy = 0.5) {
        const a = asp(),
          mx = tgt.x + fx * tgt.w,
          my = tgt.y + fy * tgt.w * a,
          w = Math.max(4, Math.min(1600, tgt.w * f));
        tgt = { x: mx - fx * w, y: my - fy * w * a, w };
        clampV(tgt);
        go();
      }
      const frac = (cx, cy) => {
        const r = svgEl.getBoundingClientRect();
        return [(cx - r.left) / r.width, (cy - r.top) / r.height];
      };
      svgEl.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const [fx, fy] = frac(e.clientX, e.clientY);
          zoomAt(Math.exp(Math.max(-120, Math.min(120, e.deltaY)) * 0.002), fx, fy);
        },
        { passive: false }
      );
      svgEl.addEventListener("dblclick", (e) => {
        const [fx, fy] = frac(e.clientX, e.clientY);
        zoomAt(0.5, fx, fy);
      });
      svgEl.addEventListener("pointerdown", (e) => {
        pts.set(e.pointerId, [e.clientX, e.clientY]);
        moved = 0;
        pinch = 0;
        svgEl.classList.add("grab");
      });
      addEventListener("pointermove", (e) => {
        const o = pts.get(e.pointerId);
        if (!o) return;
        pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size == 1) {
          const dx = e.clientX - o[0],
            dy = e.clientY - o[1],
            u = cur.w / svgEl.clientWidth;
          moved += Math.abs(dx) + Math.abs(dy);
          cur.x -= dx * u;
          cur.y -= dy * u;
          tgt.x -= dx * u;
          tgt.y -= dy * u;
          clampV(cur);
          clampV(tgt);
          applyView();
        } else if (pts.size == 2) {
          const [p, q] = [...pts.values()],
            d = Math.hypot(p[0] - q[0], p[1] - q[1]);
          if (pinch) {
            const [fx, fy] = frac((p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
            zoomAt(pinch / d, fx, fy);
            cur = { ...tgt };
            applyView();
            moved = 99;
          }
          pinch = d;
        }
      });
      const up = (e) => {
        pts.delete(e.pointerId);
        pinch = 0;
        if (!pts.size) svgEl.classList.remove("grab");
      };
      addEventListener("pointerup", up);
      addEventListener("pointercancel", up);
      svgEl.addEventListener("click", (e) => {
        if (moved > 6) return;
        const t = e.target.closest && e.target.closest(".node");
        if (t) select(t.dataset.id);
      });
      function select(id) {
        sel = id;
        svgEl.querySelectorAll(".node.sel").forEach((x) => x.classList.remove("sel"));
        if (nodeById[id]) nodeById[id].classList.add("sel");
        const own = new Set(ownA());
        info(own, frontier().drawable);
      }
      document.getElementById("zi").onclick = () => zoomAt(0.55);
      document.getElementById("zo").onclick = () => zoomAt(1.8);
      document.getElementById("zr").onclick = () => {
        tgt = fit();
        go();
      };
      function fitOwned() {
        const o = ownA();
        if (!o.length) return;
        let x0 = 1e9,
          x1 = -1e9,
          y0 = 1e9,
          y1 = -1e9;
        o.forEach((i) => {
          const a = AD[i],
            x = px(a),
            y = py(a);
          x0 = Math.min(x0, x);
          x1 = Math.max(x1, x);
          y0 = Math.min(y0, y);
          y1 = Math.max(y1, y);
        });
        const a = asp(),
          pad = R * 1.2,
          w = Math.max(40, x1 - x0 + 2 * pad, (y1 - y0 + 2 * pad) / a);
        tgt = { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - (w * a) / 2, w };
        clampV(tgt);
        go();
      }
      document.getElementById("zm").onclick = fitOwned;
      addEventListener("resize", () => applyView(true));
      function syncTiles(w, h) {
        const g = document.getElementById("tiles");
        if (!g || !TILES) return;
        const cw = svgEl.clientWidth || 800;
        let z = Math.max(4, Math.min(18, Math.round(Math.log2((14400 * cw) / (256 * w))) + 1));
        const rng = (z) => {
          const n = 2 ** z,
            fx = (v) => Math.floor(((v / 40 + 175) / 360) * n),
            fy = (v) => Math.floor((n / 2) * (1 - (Y0 - v / K) / Math.PI));
          return { n, x0: fx(cur.x), x1: fx(cur.x + w), y0: fy(cur.y), y1: fy(cur.y + h) };
        };
        let r = rng(z);
        while (z > 4 && (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1) > 48) {
          z--;
          r = rng(z);
        }
        const key = [z, r.x0, r.x1, r.y0, r.y1].join();
        if (key == tileKey) return;
        tileKey = key;
        const n = r.n,
          ts = 14400 / n,
          need = new Set();
        for (let tx = r.x0; tx <= r.x1; tx++)
          for (let ty = r.y0; ty <= r.y1; ty++) {
            if (tx < 0 || ty < 0 || tx >= n || ty >= n) continue;
            const x = tx * ts - 7000,
              y = (Y0 - Math.PI * (1 - (2 * ty) / n)) * K;
            if (
              !zp.some(
                (q) =>
                  Math.abs(q[0] - x - ts / 2) < R + ts / 2 &&
                  Math.abs(q[1] - y - ts / 2) < R + ts / 2
              )
            )
              continue;
            const k = z + "/" + tx + "/" + ty;
            need.add(k);
            if (tiles.has(k)) continue;
            const im = document.createElementNS(NS, "image");
            im.setAttribute("href", TILES.replace("{z}", z).replace("{x}", tx).replace("{y}", ty));
            im.setAttribute("x", x);
            im.setAttribute("y", y);
            im.setAttribute("width", ts + 0.4);
            im.setAttribute("height", ts + 0.4);
            im.setAttribute("opacity", "0");
            im.addEventListener("load", () => im.setAttribute("opacity", "1"));
            g.appendChild(im);
            tiles.set(k, im);
          }
        for (const [k, im] of [...tiles])
          if (!need.has(k)) {
            tiles.delete(k);
            setTimeout(() => im.remove(), 800);
          }
      }
      function applyView(f) {
        const w = cur.w,
          h = w * asp();
        svgEl.setAttribute("viewBox", `${cur.x} ${cur.y} ${w} ${h}`);
        if (f || Math.abs(w - lastW) > w * 0.003) {
          lastW = w;
          const u = w / (svgEl.clientWidth || 600),
            sc = w > 300 ? 0.6 : w > 120 ? 0.85 : 1;
          for (const n of nodeEls) n.el.setAttribute("r", ((2.6 + n.s * 1.5) * sc * u).toFixed(3));
          for (const l of lbEls) {
            l.setAttribute("font-size", (13 * u).toFixed(3));
            l.setAttribute("dx", (10 * u).toFixed(3));
            l.setAttribute("dy", (4 * u).toFixed(3));
          }
          svgEl.classList.toggle("lab", w < 230);
          svgEl.classList.toggle("sat", w < 160);
        }
        syncTiles(w, h);
      }
      function buildMap(own, drawable) {
        const f1 = (v) => v.toFixed(1);
        zp = [...own].map((i) => [px(AD[i]), py(AD[i])]);
        P.filter((p) => st.inv[p.id]).forEach((p) => {
          const a = AD[p.a],
            b = AD[p.b];
          for (const t of [0.2, 0.4, 0.6, 0.8])
            zp.push([px(a) + (px(b) - px(a)) * t, py(a) + (py(b) - py(a)) * t]);
        });
        let m = "";
        P.filter((p) => st.inv[p.id]).forEach((p) => {
          const a = AD[p.a],
            b = AD[p.b];
          m += `<line x1="${f1(px(a))}" y1="${f1(py(a))}" x2="${f1(px(b))}" y2="${f1(py(b))}" stroke="#fff" stroke-width="${R * 2}" stroke-linecap="round"/>`;
        });
        own.forEach(
          (i) =>
            (m += `<circle cx="${f1(px(AD[i]))}" cy="${f1(py(AD[i]))}" r="${R * 0.8}" fill="#fff"/>`)
        );
        let s = `<defs><mask id="zone" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="900"><rect x="-100" y="-100" width="900" height="900" fill="#000"/>${m}</mask></defs>`;
        s += `<path class="land" d="${FR.map((r) => "M" + r.map((q) => f1(X(q[0])) + "," + f1(Y(q[1]))).join("L") + "Z").join("")}"/><g mask="url(#zone)"><rect x="-100" y="-100" width="900" height="900" fill="#4b6c35"/><g id="tiles"></g></g><g>`;
        s +=
          P.map((p) => {
            const a = AD[p.a],
              b = AD[p.b];
            return `<line class="rd${st.inv[p.id] ? " on" : ""}" x1="${f1(px(a))}" y1="${f1(py(a))}" x2="${f1(px(b))}" y2="${f1(py(b))}"/>`;
          }).join("") + "</g><g>";
        s +=
          A.map(([id]) => {
            const a = AD[id],
              c = own.has(id) ? "own" : drawable.includes(id) ? "next" : "";
            return `<circle class="node ${c}${sel == id ? " sel" : ""}" data-id="${id}" cx="${f1(px(a))}" cy="${f1(py(a))}" r="2"/>`;
          }).join("") + "</g><g>";
        s +=
          [...own]
            .map((id) => {
              const a = AD[id];
              return `<text class="lb" x="${f1(px(a))}" y="${f1(py(a))}">${a.name}</text>`;
            })
            .join("") + "</g>";
        svgEl.innerHTML = s;
        tiles = new Map();
        tileKey = "";
        nodeById = {};
        nodeEls = [...svgEl.querySelectorAll(".node")].map((el) => {
          nodeById[el.dataset.id] = el;
          return { el, s: AD[el.dataset.id].size };
        });
        lbEls = [...svgEl.querySelectorAll(".lb")];
        applyView(true);
      }
      function showDetail(k) {
        const box = document.getElementById("box"),
          n = st.inv[k] || 1,
          own = new Set(ownA()),
          row = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
        let t,
          rows,
          ph = "";
        if (AD[k]) {
          const a = AD[k],
            q = S[a.size],
            nb = [...a.adj]
              .map((i) => AD[i])
              .map((m) => `${own.has(m.id) ? "✔" : "·"} ${m.name}`)
              .join("<br>");
          t = a.name;
          const dl = 0.0018,
            dn = (dl * 4) / 3 / Math.cos((a.lat * Math.PI) / 180);
          ph = `<div class="phw"><img class="ph" alt="Vue aérienne de ${a.name}" src="https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ORTHOIMAGERY.ORTHOPHOTOS&STYLES=&CRS=EPSG:4326&BBOX=${a.lat - dl},${a.lon - dn},${a.lat + dl},${a.lon + dn}&WIDTH=480&HEIGHT=360&FORMAT=image/jpeg" onerror="this.parentNode.style.display='none'"></div>`;
          rows = [

          ];
        } else if (k[0] == "p") {
          const p = PD[k],
            u = AD[p.a],
            v = AD[p.b],
            j = p.road == "jonction",
            km = Math.max(
              1,
              Math.round(
                Math.hypot(
                  (u.lat - v.lat) * 111,
                  (u.lon - v.lon) * 111 * Math.cos(((u.lat + v.lat) * Math.PI) / 360)
                )
              )
            );
          t =
            u.name == v.name
              ? `${u.name} (${u.ref}) ↔ ${v.name} (${v.ref})`
              : `${u.name} ↔ ${v.name}`;
          rows = [
            row("Type", j ? "Jonction" : "Portion"),
            row("Autoroute", j ? (u.ref == v.ref ? u.ref : u.ref + " ↔ " + v.ref) : p.road),
            row("Aire 1", u.name + " (" + u.ref + ")" + (own.has(p.a) ? " ✔" : "")),
            row("Aire 2", v.name + " (" + v.ref + ")" + (own.has(p.b) ? " ✔" : "")),
            row("Distance", "≈ " + km + " km"),
            row("Rareté", "Commune"),
          ];
        } else {
          const v = V[+k.slice(2)];
          t = v[1];
          rows = [
            row("Type", "Carte de remplissage"),
            row("Rareté", "Commune"),
            row("Utilité", "Ne sert à rien"),
          ];
        }
        box.innerHTML = `<div class="det">${cardHTML(k, { count: n })}<div><h2>${t}</h2>${ph}<dl>${rows.join("")}</dl><p class="muted">Exemplaires : ${n}</p>${AD[k] ? `<button id="see">Voir sur la carte</button> ` : ""}<button id="cl">Fermer</button></div></div>`;
        const ov = document.getElementById("ov");
        ov.classList.add("on");
        document.getElementById("cl").onclick = () => ov.classList.remove("on");
        const sb = document.getElementById("see");
        if (sb)
          sb.onclick = () => {
            ov.classList.remove("on");
            document.querySelector('nav button[data-v="map"]').click();
            focus(k, 30);
            select(k);
          };
      }
      const gridEl = document.getElementById("grid");
      gridEl.addEventListener("click", (e) => {
        const c = e.target.closest(".cw");
        if (c) showDetail(c.dataset.k);
      });
      gridEl.addEventListener("keydown", (e) => {
        const c = e.target.closest(".cw");
        if (c && (e.key == "Enter" || e.key == " ")) {
          e.preventDefault();
          showDetail(c.dataset.k);
        }
      });
      document.getElementById("ov").addEventListener("click", (e) => {
        if (e.target.id == "ov" && st) e.currentTarget.classList.remove("on");
      });
      document.getElementById("open").onclick = openPack;
      document.querySelectorAll("nav button").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll("nav button")
              .forEach((x) => x.setAttribute("aria-selected", x == b));
            document
              .querySelectorAll(".view")
              .forEach((v) => v.classList.toggle("on", v.id == b.dataset.v));
            if (b.dataset.v == "map") applyView(true);
          })
      );
      setInterval(() => {
        if (!st) return;
        const before = st.packs;
        tick();
        const left = st.packs >= MAXP ? 0 : GAP - (now() - st.last);
        document.getElementById("timer").textContent =
          st.packs >= MAXP
            ? "Stock plein"
            : `Prochain pack : ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
        if (st.packs != before) render();
      }, 1000);
      // --- Déconnexion ---
      document.getElementById("btn_logout").onclick = () => {
        localStorage.removeItem("aire_jwt"); // On supprime le token
        window.location.reload(); // On rafraîchit la page pour revenir à l'écran d'accueil
      };
      (async function init() {
        if (token) {
          try {
            const res = await fetch(`${API_URL}/me`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) throw new Error("Token expiré");

            const data = await res.json();
            st = data.state;
            if (st) {
              focus(ownA()[0]);
              render();
              return;
            }
          } catch (e) {
            localStorage.removeItem("aire_jwt");
            token = null;
          }
        }

        tgt = fit();
        cur = { ...tgt };
        applyView(true);
        welcome();
      })();
    </script>
  </body>
</html>
